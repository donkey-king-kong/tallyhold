<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tallyhold Agent Monitor Preview</title>
    <link rel="stylesheet" href="../media/styles.css" />
    <style>
      :root {
        color-scheme: dark;
        --vscode-font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --vscode-editor-font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --vscode-font-size: 13px;
        --vscode-foreground: #d4d4d4;
        --vscode-descriptionForeground: #a7a7a7;
        --vscode-editor-background: #181818;
        --vscode-editorWidget-background: #202124;
        --vscode-input-background: #242529;
        --vscode-input-foreground: #f1f1f1;
        --vscode-button-background: #0e639c;
        --vscode-button-foreground: #ffffff;
        --vscode-button-hoverBackground: #1177bb;
        --vscode-panel-border: #3a3a3a;
        --vscode-focusBorder: #4daafc;
      }
    </style>
    <script>
      window.acquireVsCodeApi = () => ({ postMessage: () => undefined });
    </script>
  </head>
  <body class="vscode-dark">
    <main id="app"></main>
    <script src="../media/webview.js"></script>
    <script>
      const now = Date.now();
      const instant = (secondsAgo) =>
        new Date(now - secondsAgo * 1000).toISOString();
      const interval = (startedAgo, endedAgo = null) => ({
        start: 0,
        end: endedAgo == null ? null : startedAgo - endedAgo,
        certainty: "reported",
        startAbsoluteTime: instant(startedAgo),
        endAbsoluteTime: endedAgo == null ? null : instant(endedAgo),
      });
      const activity = (type, secondsAgo, summary) => ({
        type,
        time: 0,
        absoluteTime: instant(secondsAgo),
        summary,
      });
      const nodes = [
        {
          id: "orchestrator",
          task: "Coordinate Feature 008 correction",
          status: "working",
          relationship: "root",
          terminal: false,
          intervals: [interval(6400)],
          activities: [activity("agent_spawn", 6400, "Coordinate correction")],
          lastUpdateAge: 7,
          reportedRole: "coordinator",
        },
        {
          id: "wt-feature-008",
          parentId: "orchestrator",
          task: "Agent Monitor visual correction",
          status: "working",
          relationship: "resolved",
          terminal: false,
          intervals: [interval(5900)],
          activities: [activity("agent_spawn", 5900, "Implement approved UI")],
          lastUpdateAge: 18,
          reportedRole: "implementer",
        },
        {
          id: "wt-feature-008-reviewer",
          parentId: "wt-feature-008",
          task: "Compare preview with approved mock",
          status: "waiting",
          relationship: "resolved",
          terminal: false,
          intervals: [interval(4200)],
          activities: [
            activity("agent_spawn", 4200, "Review approved visual target"),
            activity("message", 90, "Waiting for refreshed screenshots"),
          ],
          lastUpdateAge: 90,
          reportedRole: "reviewer",
        },
        {
          id: "wt-market-data",
          parentId: "orchestrator",
          task: "Verify market data adapter",
          status: "failed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(3600, 2100)],
          activities: [
            activity("agent_spawn", 3600, "Run adapter checks"),
            activity("error", 2100, "Fixture checksum mismatch"),
          ],
          lastUpdateAge: 2100,
          reportedRole: "test-writer",
        },
        {
          id: "wt-market-data-adapter",
          parentId: "wt-market-data",
          task: "Repair deterministic fixture",
          status: "working",
          relationship: "resolved",
          terminal: false,
          intervals: [interval(1800)],
          activities: [activity("agent_spawn", 1800, "Repair fixture")],
          lastUpdateAge: 42,
          reportedRole: "implementer",
        },
        {
          id: "wt-docs",
          parentId: "orchestrator",
          task: "Update delivery records",
          status: "completed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(5200, 700)],
          activities: [
            activity("agent_spawn", 5200, "Update records"),
            activity("agent_complete", 700, "Tracking updated"),
          ],
          lastUpdateAge: 700,
          reportedRole: "documenter",
        },
        {
          id: "wt-docs-run-recorder",
          parentId: "wt-docs",
          task: "Record smoke and verification evidence",
          status: "completed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(4100, 850)],
          activities: [
            activity("agent_spawn", 4100, "Record smoke evidence"),
            activity("agent_complete", 850, "Evidence recorded"),
          ],
          lastUpdateAge: 850,
          reportedRole: "recorder",
        },
      ];
      const edges = nodes
        .filter((node) => node.parentId)
        .map((node) => ({ parentId: node.parentId, childId: node.id }));
      window.postMessage({
        type: "state",
        generation: 1,
        path: "/tallyhold/.agent-flow/agent-flow-events.jsonl",
        sessionId: "feature-008-smoke-3",
        sourceGeneration: 1,
        reader: "following",
        diagnostics: [],
        companions: [],
        projection: {
          nodes,
          edges,
          diagnostics: [],
          lastEventAbsoluteTime: instant(7),
        },
      });
      const selectPreviewAgent = () => {
        const agent = document.querySelector(
          'button[data-node-id="wt-feature-008-reviewer"]',
        );
        if (agent) agent.click();
        else setTimeout(selectPreviewAgent, 20);
      };
      selectPreviewAgent();
    </script>
  </body>
</html>
