<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tallyhold Agent Monitor Preview</title>
    <link rel="stylesheet" href="../media/styles.css" />
    <style>
      :root {
        color-scheme: dark;
        --vscode-font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --vscode-editor-font-family:
          "SF Mono", Menlo, Monaco, "SFMono-Regular", Consolas,
          "Liberation Mono", monospace;
        --vscode-font-size: 13px;
        --vscode-foreground: #d4d4d4;
        --vscode-descriptionForeground: #a7a7a7;
        --vscode-editor-background: #181818;
        --vscode-editorWidget-background: #202124;
        --vscode-input-background: #242529;
        --vscode-input-foreground: #f1f1f1;
        --vscode-button-background: #0e639c;
        --vscode-button-foreground: #ffffff;
        --vscode-button-hoverBackground: #1177bb;
        --vscode-panel-border: #3a3a3a;
        --vscode-focusBorder: #4daafc;
      }
    </style>
    <script>
      window.acquireVsCodeApi = () => ({ postMessage: () => undefined });
    </script>
  </head>
  <body class="vscode-dark">
    <main id="app"></main>
    <script src="../media/webview.js"></script>
    <script>
      (async () => {
      const adapterSlug = async (branch) => {
        if (branch === "main") return "main";
        const normalized =
          branch
            .toLowerCase()
            .replace(/[^a-z0-9_-]+/g, "-")
            .replace(/^[-_]+|[-_]+$/g, "") || "worktree";
        const digest = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(branch),
        );
        const hash = Array.from(new Uint8Array(digest))
          .map((value) => value.toString(16).padStart(2, "0"))
          .join("")
          .slice(0, 8);
        return `${normalized.slice(0, 15)}-${hash}`;
      };
      const sourceWorktrees = {
        shared: await adapterSlug("chore/shared-agent-flow-stream"),
        transactions: await adapterSlug("feature/007-transactions"),
        main: await adapterSlug("main"),
      };
      const rootIds = Object.fromEntries(
        Object.entries(sourceWorktrees).map(([key, slug]) => [
          key,
          `wt-${slug}`,
        ]),
      );
      const agentId = (root, agent) => `${rootIds[root]}-${agent}`;
      const now = Date.now();
      const instant = (secondsAgo) =>
        new Date(now - secondsAgo * 1000).toISOString();
      const interval = (startedAgo, endedAgo = null) => ({
        start: 0,
        end: endedAgo == null ? null : startedAgo - endedAgo,
        certainty: "reported",
        startAbsoluteTime: instant(startedAgo),
        endAbsoluteTime: endedAgo == null ? null : instant(endedAgo),
      });
      const activity = (type, secondsAgo, summary, details = {}) => ({
        type,
        time: 0,
        absoluteTime: instant(secondsAgo),
        summary,
        ...details,
      });
      const day = 24 * 60 * 60;
      const roots = [
        {
          id: rootIds.shared,
          parentId: "orchestrator",
          sourceWorktree: sourceWorktrees.shared,
          task: "Shared Agent Flow stream",
          relationship: "resolved",
          terminal: false,
          intervals: [interval(6800)],
          activities: [],
          lastUpdateAge: 12,
        },
        {
          id: rootIds.transactions,
          parentId: "orchestrator",
          sourceWorktree: sourceWorktrees.transactions,
          task: "Feature 007 transactions",
          relationship: "resolved",
          terminal: false,
          intervals: [interval(5200)],
          activities: [],
          lastUpdateAge: 22 * 60,
        },
        {
          id: rootIds.main,
          parentId: "orchestrator",
          sourceWorktree: sourceWorktrees.main,
          task: "Main checkout",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(7600, 4200)],
          activities: [],
          lastUpdateAge: 4200,
        },
      ];
      const activeNodes = [
        {
          id: "orchestrator",
          sourceWorktree: sourceWorktrees.shared,
          task: "Session anchor",
          status: "completed",
          relationship: "root",
          terminal: true,
          intervals: [interval(7 * day, 6 * day)],
          activities: [
            activity("agent_spawn", 7 * day, "Coordinate shared stream"),
            activity("agent_complete", 6 * day, "Session complete"),
          ],
          lastUpdateAge: 6 * day,
          reportedRole: "coordinator",
        },
        {
          id: agentId("shared", "planner"),
          parentId: rootIds.shared,
          sourceWorktree: sourceWorktrees.shared,
          task: "Plan shared stream",
          status: "completed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(6400, 3840)],
          activities: [
            activity("agent_spawn", 6400, "Plan shared stream"),
            activity("agent_complete", 3840, "Plan approved"),
          ],
          lastUpdateAge: 3840,
          reportedRole: "planner",
        },
        {
          id: agentId("shared", "test-writer"),
          parentId: rootIds.shared,
          sourceWorktree: sourceWorktrees.shared,
          task: "Write shared stream RED",
          status: "completed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(3300, 2280)],
          activities: [
            activity("agent_spawn", 3300, "Write shared stream RED"),
            activity("agent_complete", 2280, "RED handed off"),
          ],
          lastUpdateAge: 2280,
          reportedRole: "test-writer",
        },
        {
          id: agentId("shared", "red-reviewer-r1"),
          parentId: rootIds.shared,
          sourceWorktree: sourceWorktrees.shared,
          task: "Review RED round 1",
          status: "failed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(1900, 1320)],
          activities: [
            activity("agent_spawn", 1900, "Review RED round 1"),
            activity("error", 1320, "Launch refused connection"),
          ],
          lastUpdateAge: 1320,
          reportedRole: "red-reviewer",
        },
        {
          id: agentId("shared", "red-reviewer-r1b"),
          parentId: rootIds.shared,
          sourceWorktree: sourceWorktrees.shared,
          task: "Review corrected RED",
          status: "completed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(950, 540)],
          activities: [
            activity("agent_spawn", 950, "Review corrected RED"),
            activity("agent_complete", 540, "Changes requested"),
          ],
          lastUpdateAge: 540,
          reportedRole: "red-reviewer",
        },
        {
          id: agentId("shared", "test-writer-r2"),
          parentId: rootIds.shared,
          sourceWorktree: sourceWorktrees.shared,
          task: "Address RED review round 1",
          status: "working",
          relationship: "resolved",
          terminal: false,
          intervals: [interval(374)],
          activities: [
            activity("agent_spawn", 374, "Address RED review round 1"),
            activity("tool_call_end", 366, "Read", {
              outcome: "succeeded",
              toolCategory: "Read",
              toolDurationSeconds: 41,
            }),
            activity("tool_call_end", 237, "Edit", {
              outcome: "succeeded",
              toolCategory: "Edit",
              toolDurationSeconds: 192,
            }),
            activity("tool_call_end", 92, "Test", {
              outcome: "failed",
              toolCategory: "Test",
              toolDurationSeconds: 18,
            }),
            activity("message", 12, "Running tests"),
          ],
          lastUpdateAge: 12,
          reportedRole: "test-writer",
        },
        {
          id: agentId("transactions", "spec-writer"),
          parentId: rootIds.transactions,
          sourceWorktree: sourceWorktrees.transactions,
          task: "Draft transactions spec",
          status: "waiting",
          relationship: "resolved",
          terminal: false,
          intervals: [interval(1320)],
          activities: [
            activity("agent_spawn", 1320, "Draft transactions spec"),
            activity("permission_requested", 1320, "Awaiting Gate 1"),
          ],
          lastUpdateAge: 1320,
          reportedRole: "spec-writer",
        },
        {
          id: agentId("main", "setup"),
          parentId: rootIds.main,
          sourceWorktree: sourceWorktrees.main,
          task: "Update issue",
          status: "completed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(5200, 4200)],
          activities: [
            activity("agent_spawn", 5200, "Update issue"),
            activity("agent_complete", 4200, "Issue #44 updated"),
          ],
          lastUpdateAge: 4200,
          reportedRole: "setup",
        },
      ];
      const olderNodes = Array.from({ length: 18 }, (_, index) => {
        const startedAgo = (index + 2) * day;
        return {
          id: agentId(
            "shared",
            `older-${String(index + 1).padStart(2, "0")}`,
          ),
          parentId: rootIds.shared,
          sourceWorktree: sourceWorktrees.shared,
          task: `Older completed agent ${index + 1}`,
          status: "completed",
          relationship: "resolved",
          terminal: true,
          intervals: [interval(startedAgo, startedAgo - 900)],
          activities: [
            activity("agent_spawn", startedAgo, `Older agent ${index + 1}`),
            activity(
              "agent_complete",
              startedAgo - 900,
              `Older agent ${index + 1} complete`,
            ),
          ],
          lastUpdateAge: startedAgo - 900,
          reportedRole: "worker",
        };
      });
      const nodes = [...roots, ...activeNodes, ...olderNodes];
      const edges = nodes
        .filter((node) => node.parentId)
        .map((node) => ({ parentId: node.parentId, childId: node.id }));
      window.postMessage({
        type: "state",
        generation: 1,
        path: "/tallyhold/.agent-flow/agent-flow-events.jsonl",
        sessionId: "tallyhold-shared",
        sourceGeneration: 1,
        reader: "following",
        diagnostics: [],
        companions: Array.from({ length: 21 }, (_, index) => ({
          agentId: `heartbeat-${index + 1}`,
          status: "completed",
          activity: "snapshot",
          updatedAt: instant(index + 1),
          certainty: "provisional",
          source: "heartbeat",
        })),
        projection: {
          nodes,
          edges,
          diagnostics: [],
          lastEventAbsoluteTime: instant(7),
        },
        sourceWorktree: sourceWorktrees.shared,
      });
      const selectPreviewAgent = () => {
        const agent = document.querySelector(
          `button[data-node-id="${agentId("shared", "test-writer-r2")}"]`,
        );
        if (agent) agent.click();
        else setTimeout(selectPreviewAgent, 20);
      };
      selectPreviewAgent();
      })();
    </script>
  </body>
</html>
